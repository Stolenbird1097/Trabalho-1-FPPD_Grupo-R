name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
      - name: Código formatado (gofmt)
        run: test -z "$(gofmt -l .)" || (gofmt -l . && echo "Rode: gofmt -w ." && exit 1)
      - name: go vet
        run: go vet ./...
      - name: Build
        run: go build ./...
